<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>DuoTok Preview</title><link rel="manifest" href="manifest.webmanifest"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#08090c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}.top{padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;display:flex;justify-content:space-between;align-items:center;background:#101116}.brand{font-weight:800;letter-spacing:.3px}.sub{color:#9da0a9;font-size:12px}.viewer{min-height:0;display:flex;align-items:center;justify-content:center;gap:18px;padding:12px}.video-wrap{height:100%;max-height:100%;aspect-ratio:9/16;max-width:100%;position:relative;border-radius:14px;overflow:hidden;background:#20232a;touch-action:pan-y}.video-wrap video{width:100%;height:100%;object-fit:cover}.overlay{position:absolute;bottom:18px;left:14px;right:14px;text-shadow:0 1px 6px #000}.overlay strong{display:block;margin-bottom:5px}.side{width:min(32vw,300px);display:none}.side h2{font-size:19px}.side p{line-height:1.6;color:#bec0c8}.actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}.actions button,.bottom button{border:0;color:white;background:#272a33;border-radius:10px;padding:12px;font-size:14px}.bottom{display:flex;justify-content:space-around;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);background:#101116}.bottom button{flex:1}.active{background:#ee285c!important}.hint{font-size:12px;color:#aeb0b9}@media(min-width:650px){.side{display:block}.viewer{padding:18px}.video-wrap{border-radius:18px}}@media(max-width:649px){.video-wrap{border-radius:0}.viewer{padding:0}.bottom{padding-top:7px}.top{padding-bottom:9px}}</style></head><body><div class="app"><header class="top"><span class="brand">DuoTok <span class="sub">Preview 0.1</span></span><span class="sub" id="mode">自適應模式</span></header><main class="viewer"><section class="video-wrap" id="surface"><video id="player" playsinline webkit-playsinline loop muted autoplay preload="metadata"></video><div class="overlay"><strong id="author">@DuoTok</strong><span id="caption">向上滑動，切換測試影片</span></div></section><aside class="side"><h2>為 Duo 而設計</h2><p id="description">展開時影片維持 9:16，不會被拉伸。右側保留互動與資訊空間。</p><div class="actions"><button id="prev">上一支 ↑</button><button id="next">下一支 ↓</button><button id="sound">開啟聲音</button></div><p class="hint">這是本機播放器測試，不連接抖音帳號或推薦系統。</p></aside></main><nav class="bottom"><button class="active" id="feed">推薦</button><button id="change">下一支 ↓</button><button id="toggle">播放／暫停</button></nav></div><script>const clips=[{url:'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',caption:'測試影片 1 · 花朵',author:'@Demo'},{url:'https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4',caption:'測試影片 2 · 風景',author:'@Demo'}];let index=0;const player=document.getElementById('player');function load(n){index=(n+clips.length)%clips.length;player.src=clips[index].url;document.getElementById('caption').textContent=clips[index].caption;document.getElementById('author').textContent=clips[index].author;player.play().catch(()=>{});}function next(){load(index+1)}function prev(){load(index-1)}document.getElementById('next').onclick=next;document.getElementById('change').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('toggle').onclick=()=>player.paused?player.play():player.pause();document.getElementById('sound').onclick=()=>{player.muted=!player.muted;document.getElementById('sound').textContent=player.muted?'開啟聲音':'靜音'};let y=0;const s=document.getElementById('surface');s.addEventListener('touchstart',e=>{y=e.touches[0].clientY},{passive:true});s.addEventListener('touchend',e=>{const dy=e.changedTouches[0].clientY-y;if(Math.abs(dy)>65){dy<0?next():prev()}},{passive:true});let lock=false;s.addEventListener('wheel',e=>{if(lock||Math.abs(e.deltaY)<15)return;lock=true;e.deltaY>0?next():prev();setTimeout(()=>lock=false,500)},{passive:true});function mode(){document.getElementById('mode').textContent=innerWidth>=650?'展開／寬螢幕':'摺疊／窄螢幕'}addEventListener('resize',mode);mode();load(0);</script></body></html>
