<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>DuoTok 0.2</title>
<style>
:root{color-scheme:dark;--bg:#09090d;--muted:#b9b9c2;--accent:#ff315d}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;overflow:hidden}button{font:inherit;cursor:pointer;color:inherit;border:0;background:none}button:focus-visible{outline:2px solid white;outline-offset:3px}.app{height:100dvh;display:grid;grid-template-rows:1fr auto;overflow:hidden}.stage{min-height:0;display:flex;justify-content:center;align-items:stretch;gap:0;position:relative}.player-shell{height:100%;min-width:0;aspect-ratio:9/16;max-width:100%;background:#15151b;position:relative;overflow:hidden;isolation:isolate}.player-shell video{width:100%;height:100%;object-fit:cover;display:block}.gradient{position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,rgba(0,0,0,.78),transparent 34%,transparent 72%,rgba(0,0,0,.32))}.top{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:0;right:0;display:flex;justify-content:center;align-items:center;gap:22px;z-index:2;text-shadow:0 1px 5px #000}.top button{font-weight:650;font-size:16px;opacity:.7}.top button.active{opacity:1}.top button.active:after{content:"";display:block;height:3px;background:#fff;border-radius:5px;margin:6px auto 0;width:22px}.caption{position:absolute;bottom:32px;left:16px;right:76px;z-index:2;text-shadow:0 1px 5px #000}.caption strong{display:block;margin-bottom:8px;font-size:16px}.caption p{margin:0;font-size:14px;line-height:1.5}.caption small{display:block;margin-top:8px;color:#e1e1e5;font-size:11px}.rail{position:absolute;right:10px;bottom:52px;z-index:3;display:flex;flex-direction:column;gap:18px;align-items:center}.rail button{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:48px;font-size:11px;text-shadow:0 1px 4px #000}.rail svg{width:29px;height:29px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.rail .liked svg{fill:var(--accent);stroke:var(--accent)}.progress{position:absolute;bottom:0;left:0;right:0;height:3px;background:#ffffff4d;z-index:5}.progress span{display:block;height:100%;width:0;background:white}.center-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:52px;text-shadow:0 2px 10px #000;opacity:0;pointer-events:none;transition:opacity .15s}.center-play.visible{opacity:1}.desktop-panel{display:none}.nav{height:calc(54px + env(safe-area-inset-bottom));padding:0 14px env(safe-area-inset-bottom);background:#101015;display:flex;align-items:center;justify-content:space-around;border-top:1px solid #ffffff18;gap:4px}.nav button{font-size:12px;font-weight:600;min-width:48px;min-height:40px}.nav button.active{color:white}.nav button:not(.active){color:#9999a4}.nav .plus{background:#fff;color:#0b0b0f;font-size:25px;line-height:27px;width:38px;height:29px;border-radius:7px}.panel-overlay{position:fixed;inset:0;background:#0009;z-index:20;display:none}.panel-overlay.open{display:block}.sheet{position:absolute;bottom:0;left:0;right:0;max-height:75dvh;min-height:38dvh;background:#1b1b23;border-radius:20px 20px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 24px);overflow:auto}.sheet h2{font-size:17px;margin:0 0 20px}.sheet p{color:#c7c7ce;line-height:1.6}.close{float:right;font-size:23px}.hint{font-size:12px;color:#a3a3af}.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#2b2b35;padding:10px 16px;border-radius:30px;font-size:13px;opacity:0;pointer-events:none;z-index:30;transition:opacity .2s;white-space:nowrap}.toast.show{opacity:1}
@media(min-width:650px){.app{grid-template-rows:1fr 58px}.stage{padding:12px 18px;gap:22px}.player-shell{border-radius:14px;flex:none}.desktop-panel{display:flex;width:min(34vw,380px);flex-direction:column;justify-content:center;gap:22px;min-width:210px}.desktop-panel .brand{font-size:24px;font-weight:800;letter-spacing:-.6px}.desktop-panel .intro{color:#b4b4c0;font-size:14px;line-height:1.7}.desktop-panel .controls{display:flex;gap:10px;flex-wrap:wrap}.desktop-panel .controls button{background:#25252f;padding:12px 16px;border-radius:12px;font-size:14px}.desktop-panel .controls button.primary{background:var(--accent)}.desktop-panel .notice{font-size:12px;color:#92929d;line-height:1.6}.rail{right:12px}.nav{height:58px;padding:0 18px}.caption{bottom:35px}.sheet{width:min(480px,100%);left:auto;right:0;max-height:100dvh;height:100dvh;border-radius:18px 0 0 18px}}
@media(max-width:649px){.stage{padding:0}.player-shell{width:100%;aspect-ratio:auto}.player-shell video{object-fit:cover}.rail{bottom:70px}.caption{bottom:47px}.nav{background:#09090d}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style></head><body>
<div class="app"><main class="stage"><section class="player-shell" id="surface" aria-label="測試影片播放器"><video id="video" playsinline webkit-playsinline autoplay muted loop preload="metadata"></video><div class="gradient"></div><div class="top"><button id="following">關注</button><button class="active" id="recommended">推薦</button></div><div class="center-play" id="playIcon">▶</div><div class="caption"><strong id="author">@Demo</strong><p id="caption">DuoTok 測試影片</p><small>示範影片 · 非抖音推薦內容</small></div><div class="rail"><button id="like" aria-label="喜歡"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg><span id="likeCount">喜歡</span></button><button id="comments" aria-label="留言"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.9-5.4a8.5 8.5 0 1 1 16.1-4.1Z"/></svg><span>留言</span></button><button id="share" aria-label="分享"><svg viewBox="0 0 24 24"><path d="M12 16V3m0 0 5 5m-5-5L7 8M5 13v7h14v-7"/></svg><span>分享</span></button><button id="mute" aria-label="聲音"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4m12 0 5 6m0-6-5 6"/></svg><span id="muteLabel">靜音</span></button></div><div class="progress"><span id="bar"></span></div></section><aside class="desktop-panel"><div><div class="brand">DuoTok <span style="color:#ff315d">0.2</span></div><p class="intro">專為 Duo 展開螢幕打造的沉浸式影片介面。影片保持原始比例，操作放在適合觸控的位置。</p></div><div class="controls"><button id="prev">↑ 上一支</button><button class="primary" id="next">下一支 ↓</button><button id="pause">播放 / 暫停</button></div><p class="notice">這是免費的前端原型，僅使用公開測試影片。尚未連接抖音推薦、登入、留言或收藏服務。</p></aside></main><nav class="nav"><button id="home" class="active">首頁</button><button id="discover">探索</button><button id="create" class="plus" aria-label="新增">+</button><button id="inbox">訊息</button><button id="profile">我</button></nav></div><div class="panel-overlay" id="overlay"><div class="sheet"><button class="close" id="close" aria-label="關閉">×</button><h2 id="sheetTitle">DuoTok</h2><p id="sheetBody"></p><p class="hint">此功能目前僅供介面測試，沒有連接抖音帳號。</p></div></div><div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';const clips=[{url:'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',author:'@Demo',caption:'花朵特寫 · 測試影片 1'},{url:'https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4',author:'@Demo',caption:'旅行片段 · 測試影片 2'}];const $=id=>document.getElementById(id),v=$('video'),surface=$('surface');let index=0,startY=null,startX=null,gestureAt=0,liked=[false,false],toastTimer;function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1900)}function renderLike(){$('like').classList.toggle('liked',liked[index]);$('likeCount').textContent=liked[index]?'已喜歡':'喜歡'}function load(n){index=(n+clips.length)%clips.length;v.pause();v.src=clips[index].url;v.load();$('author').textContent=clips[index].author;$('caption').textContent=clips[index].caption;$('bar').style.width='0';renderLike();v.play().catch(()=>{$('playIcon').classList.add('visible')})}function next(){load(index+1)}function prev(){load(index-1)}function toggle(){if(v.paused){v.play().catch(()=>toast('請點擊影片開始播放'))}else v.pause()}function openPanel(title,body){$('sheetTitle').textContent=title;$('sheetBody').textContent=body;$('overlay').classList.add('open')}surface.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;startY=e.touches[0].clientY;startX=e.touches[0].clientX},{passive:true});surface.addEventListener('touchend',e=>{if(startY===null)return;const dy=e.changedTouches[0].clientY-startY,dx=e.changedTouches[0].clientX-startX;startY=null;if(Math.abs(dy)>65&&Math.abs(dy)>Math.abs(dx)*1.2&&Date.now()-gestureAt>250){gestureAt=Date.now();dy<0?next():prev()}},{passive:true});let wheelLock=false;surface.addEventListener('wheel',e=>{if(wheelLock||Math.abs(e.deltaY)<18)return;wheelLock=true;e.deltaY>0?next():prev();setTimeout(()=>wheelLock=false,550)},{passive:true});v.addEventListener('click',toggle);v.addEventListener('pause',()=>$('playIcon').classList.add('visible'));v.addEventListener('play',()=>$('playIcon').classList.remove('visible'));v.addEventListener('timeupdate',()=>{if(v.duration&&isFinite(v.duration))$('bar').style.width=(v.currentTime/v.duration*100)+'%'});v.addEventListener('error',()=>toast('影片暫時無法載入，請切換下一支'));$('like').onclick=()=>{liked[index]=!liked[index];renderLike()};$('comments').onclick=()=>openPanel('留言','測試版尚未接入抖音留言服務。未來可在此顯示已獲授權的影片留言。');$('share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:'DuoTok 測試版',url:location.href});else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);toast('已複製測試版網址')}else toast('請使用 Safari 分享按鈕')}catch(e){}};$('mute').onclick=()=>{v.muted=!v.muted;$('muteLabel').textContent=v.muted?'靜音':'有聲'};$('following').onclick=()=>openPanel('關注','尚未連接抖音帳號，因此無法讀取關注影片。');$('recommended').onclick=()=>toast('目前播放的是公開測試影片');$('home').onclick=()=>toast('你正在首頁');$('discover').onclick=()=>openPanel('探索','搜尋功能將在取得合法可用的內容來源後加入。');$('create').onclick=()=>openPanel('新增影片','目前不支援上傳。此測試版不會要求照片權限。');$('inbox').onclick=()=>openPanel('訊息','此測試版不會讀取你的私人訊息。');$('profile').onclick=()=>openPanel('我的','此測試版不會要求你輸入抖音帳號密碼。');$('close').onclick=()=>$('overlay').classList.remove('open');$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))$('overlay').classList.remove('open')});$('next').onclick=next;$('prev').onclick=prev;$('pause').onclick=toggle;document.addEventListener('keydown',e=>{if($('overlay').classList.contains('open')){if(e.key==='Escape')$('overlay').classList.remove('open');return}if(e.key==='ArrowDown')next();if(e.key==='ArrowUp')prev();if(e.key===' ')toggle()});load(0)})();
</script></body></html>
